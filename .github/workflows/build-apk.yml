name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java --version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"

          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F. '{print ($1 == "1" ? $2 : $1)}')
          echo "Detected Java major version: $JAVA_MAJOR"

          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Could not detect Java major version."
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java version is lower than 17 (detected $JAVA_MAJOR)."
            exit 1
          fi
          echo "Java 17+ environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "::error::Target APK $TARGET_APK does not exist."
            echo "Listing files in app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 4 -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "::error::Target APK $TARGET_APK is empty."
            exit 1
          fi

          echo "Verified $TARGET_APK exists and is a non-empty regular file."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare-asset
        run: |
          TMP_ASSET_DIR=$(mktemp -d -t apk-release-XXXXXX)
          REPO_RAW="${{ github.event.repository.name }}"
          if [ -z "$REPO_RAW" ]; then
            REPO_RAW=$(basename "${{ github.repository }}")
          fi
          REPO_SAFE=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-_' '-' | sed -e 's/^-*//' -e 's/-*$//')
          if [ -z "$REPO_SAFE" ]; then
            REPO_SAFE="app"
          fi

          RELEASE_FILENAME="${REPO_SAFE}-debug-build-${{ github.run_number }}.apk"
          RELEASE_ASSET_PATH="${TMP_ASSET_DIR}/${RELEASE_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_ASSET_PATH"

          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "::error::Release asset could not be prepared at $RELEASE_ASSET_PATH"
            exit 1
          fi

          echo "Prepared release asset at: $RELEASE_ASSET_PATH"
          echo "asset_path=$RELEASE_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare-asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset is invalid or missing: $ASSET_PATH"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          BODY_NOTES="### Automated Debug APK Build

- **Build Runner:** GitHub Actions
- **Workflow Run Number:** ${{ github.run_number }}
- **Workflow Run Attempt:** ${{ github.run_attempt }}
- **Commit SHA:** ${{ github.sha }}

> **Notice:** This is an automatically generated debug APK intended for testing and development purposes. It is not a Play Store production release and is signed only with a temporary debug keystore."

          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$BODY_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare-asset.outputs.asset_name }}"

          if [ "${{ steps.publish-release.outcome }}" = "success" ]; then
            echo "### GitHub Release published successfully!"
            gh release view "$RELEASE_TAG" || true

            RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Name: $ASSET_NAME"

            echo "### 📱 Debug APK Release" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was successfully built and published to GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [View Release]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Asset Filename:** \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **How to Download:** Download \`$ASSET_NAME\` directly from the **Assets** section of the release page on your Android device." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup:** The standard Actions artifact \`app-debug-apk\` is also available on this workflow run summary." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was not completed or failed. However, the APK build succeeded and the artifact was uploaded."
            echo "### ⚠️ Debug APK Build Notice" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was successfully built and preserved as a GitHub Actions artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "Publishing to GitHub Releases was not completed, but you can download the APK from the **Artifacts** section below (\`app-debug-apk\`)." >> "$GITHUB_STEP_SUMMARY"
          fi
